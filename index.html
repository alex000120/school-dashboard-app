<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reproductor de video controlado por gestos con cámara y cursor virtual." />
    <title>Gesture Video Player Pro</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="screen-shell">
        <header class="hud-bar">
          <div class="hud-left">
            <span id="fpsLabel" class="pill">FPS 5 • 119ms</span>
            <span class="pill">Gesto •</span>
            <span class="pill">Video 2/5</span>
          </div>

          <div class="hud-right">
            <button id="cameraToggle" class="icon-btn">◉</button>
            <button id="muteBtn" class="icon-btn">🔊</button>
            <button id="helpBtn" class="icon-btn">?</button>
          </div>
        </header>

        <main class="main-stage">
          <section class="viewer-panel">
            <div id="playerStage" class="player-stage">
              <video id="videoPlayer" playsinline controls preload="metadata"></video>
              <video id="cameraVideo" autoplay playsinline muted></video>
              <canvas id="handCanvas"></canvas>
              <div id="pointer" class="pointer-indicator" aria-hidden="true"></div>

              <div id="gestureBadge" class="gesture-tip">Muestra ambas manos</div>
            </div>
          </section>

          <aside class="side-panel">
            <div class="mini-camera-card">
              <div class="mini-header">
                <span>Camara</span>
                <span id="detectionState" class="mini-dot offline"></span>
              </div>
              <video id="cameraPreview" autoplay playsinline muted></video>
              <div id="gestureDetectionStatus" class="detection-status">Cámara apagada</div>
            </div>

            <div class="side-buttons">
              <button class="side-arrow up">◀</button>
              <button class="side-arrow mid">◍</button>
              <button class="side-arrow down">▶</button>
            </div>
          </aside>
        </main>

        <footer class="bottom-bar">
          <div class="address-pill">
            <span class="home-icon">⌂</span>
            <span id="urlText">alex000120.github.io/inform-tica/index9.html</span>
          </div>

          <div class="bottom-tools">
            <button class="add-btn">＋</button>
            <button class="count-btn">11</button>
            <button class="menu-btn">⋮</button>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
