<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reproductor de video controlado por gestos con cámara y cursor virtual." />
    <title>Gesture Video Player Pro</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="studio">
        <section class="player-panel">
          <div class="panel-topbar">
            <div class="project-badge">Gesture Control</div>
            <button id="cameraToggle" class="ghost-btn">Cámara</button>
          </div>

          <div id="playerStage" class="player-stage">
            <video id="videoPlayer" playsinline controls preload="metadata"></video>
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="handCanvas"></canvas>
            <div id="pointer" class="pointer-indicator" aria-hidden="true"></div>

            <div class="overlay-ui">
              <div id="gestureBadge" class="gesture-badge">Gesto: esperando</div>
              <div id="handStatus" class="status-pill">Cámara desactivada</div>
            </div>
          </div>

          <div class="bottom-strip">
            <div class="camera-preview-box">
              <div class="mini-header">
                <span>Mini cámara</span>
                <span id="detectionState" class="detection-dot offline"></span>
              </div>
              <video id="cameraPreview" autoplay playsinline muted></video>
              <div id="gestureDetectionStatus" class="detection-status">Esperando cámara...</div>
            </div>

            <div class="controls-panel">
              <div class="compact-actions">
                <button class="action-btn" data-action="prev">Anterior</button>
                <button class="action-btn" data-action="playPause">Play / Pausa</button>
                <button class="action-btn" data-action="next">Siguiente</button>
                <button class="action-btn" data-action="mute">Silenciar</button>
              </div>

              <div class="timeline-panel">
                <div class="time-row">
                  <span id="currentTime">0:00</span>
                  <input id="progressBar" type="range" min="0" max="100" value="0" aria-label="Progreso del video" />
                  <span id="totalTime">0:00</span>
                </div>

                <div class="volume-row">
                  <label for="volumeBar">Volumen</label>
                  <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Control de volumen" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="library-panel">
          <div class="panel-header-inline">
            <h3>Biblioteca</h3>
          </div>
          <div id="playlist" class="playlist"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
